<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.css" integrity="sha512-8BU3emz11z9iF75b10oPjjpamM4Mz23yQFQymbtwyPN3mNWHxpgeqyrYnkIUP6A8KyAj5k2p3MiYLtYqew7gIw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <main class="kanban">
        <!-- COLUMN 1 -->
        <div class="kanban-column" data-id='1'>
            <div class="kanban-title">
                <h2>
                    Pendente
                </h2>
                <button class="add-card-btn" type="button" aria-label="Adicionar tarefa">
                    <i class="fa-duotone fa-thin fa-plus"></i>
                </button>
            </div>

            <div class="kanban-cards">
                <div class="kanban-card" draggable="true">
                    <div class="badge low">
                        <span>
                            baixa prioridade
                        </span>
                    </div>
                    <p class="card-title">
                        Revisar documento do projeto
                    </p>
                    <div class="card-infos">
                        <div class="card-icons">
                            <p>
                                <i class="fa-regular fa-comment"></i>
                                2
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- COLUMN 2 -->
        <div class="kanban-column" data-id='2'>
            <div class="kanban-title">
                <h2>
                    Fazendo
                </h2>
                <button class="add-card-btn" type="button" aria-label="Adicionar tarefa">
                    <i class="fa-duotone fa-thin fa-plus"></i>
                </button>
            </div>

            <div class="kanban-cards">
                <div class="kanban-card" draggable="true">
                    <div class="badge high">
                        <span>
                            alta prioridade
                        </span>
                    </div>
                    <p class="card-title">
                        Revisar documento do projeto
                    </p>
                    <div class="card-infos">
                        <div class="card-icons">
                            <p>
                                <i class="fa-regular fa-comment"></i>
                                1
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- COLUMN 3 -->
        <div class="kanban-column" data-id='3'>
            <div class="kanban-title">
                <h2>
                    Teste
                </h2>
                <button class="add-card-btn" type="button" aria-label="Adicionar tarefa">
                    <i class="fa-duotone fa-thin fa-plus"></i>
                </button>
            </div>

            <div class="kanban-cards">
                <div class="kanban-card" draggable="true">
                    <div class="badge medium">
                        <span>
                            media prioridade
                        </span>
                    </div>
                    <p class="card-title">
                        Revisar documento do projeto
                    </p>
                    <div class="card-infos">
                        <div class="card-icons">
                            <p>
                                <i class="fa-regular fa-comment"></i>
                                6
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- COLUMN 4 -->
        <div class="kanban-column" data-id='4'>
            <div class="kanban-title">
                <h2>
                    Revisão
                </h2>
                <button class="add-card-btn" type="button" aria-label="Adicionar tarefa">
                    <i class="fa-duotone fa-thin fa-plus"></i>
                </button>
            </div>

            <div class="kanban-cards">
                <div class="kanban-card" draggable="true">
                    <div class="badge medium">
                        <span>
                            media prioridade
                        </span>
                    </div>
                    <p class="card-title">
                        Revisar documento do projeto
                    </p>
                    <div class="card-infos">
                        <div class="card-icons">
                            <p>
                                <i class="fa-regular fa-comment"></i>
                                2
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- COLUMN 5 -->
        <div class="kanban-column" data-id='5'>
            <div class="kanban-title">
                <h2>
                    Concluido
                </h2>
                <button class="add-card-btn" type="button" aria-label="Adicionar tarefa">
                    <i class="fa-duotone fa-thin fa-plus"></i>
                </button>
            </div>

            <div class="kanban-cards">
                <div class="kanban-card" draggable="true">
                    <div class="badge high">
                        <span>
                            alta prioridade
                        </span>
                    </div>
                    <p class="card-title">
                        Revisar documento do projeto
                    </p>
                    <div class="card-infos">
                        <div class="card-icons">
                            <p>
                                <i class="fa-regular fa-comment"></i>
                                7
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="./storage.js"></script>
    <script src="./arrasta-solta.js"></script>
    <script src="./novo-card.js"></script>
</body>
</html>
